<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  PickTheBox: a machine it picked, as the app's result card shows it.

  The card is src/components/machine_random_target.jsx: the machine's avatar
  beside an MUI table of its name, OS, difficulty and release date, with
  MUI's table metrics. The text is Roboto, which the app's cards render in,
  though its theme.jsx asks Typography for Montserrat. The app is dark only;
  here it takes the site colours instead.

  APT and its details are from public/machines_data.json (id 296). Its
  avatar, from public/machines_avatars.json, is inlined at the end of the
  file, so this template is a single file.
-->
<link rel="stylesheet" href="shared/base.css">
<style>
  @font-face {
    font-family: Roboto;
    font-weight: 400;
    src: url(../../node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2);
  }

  body {
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 0 20px 0 40px;
    font-family: Roboto, sans-serif;
  }

  .avatar {
    width: 200px;
    height: 200px;
    flex: none;
  }

  /* MUI's Table: 16px cell padding, a divider under every row */
  table {
    flex: 1;
    border-collapse: collapse;
  }
  td,
  th {
    padding: 16px;
    border-bottom: 1px solid var(--outline-variant);
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
  }
  th {
    width: 46%;
    text-align: right;
  }
  td {
    text-align: left;
  }
  .name {
    text-align: center;
    font-size: 34px;
    line-height: 1.235;
  }
</style>
</head>
